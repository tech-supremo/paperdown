name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"
      - "UPGRADE.md"
      - ".github/workflows/build-installers.yml"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Paperdown-macOS
          path: outputs/Paperdown-macOS.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: corepack enable
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: powershell
        run: .\packaging\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Paperdown-Windows
          path: outputs/Paperdown-Windows-Setup.exe
          if-no-files-found: error

  release:
    needs: [validate, macos, windows]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Paperdown-*
          path: release
          merge-multiple: true
      - name: Prepare release assets
        shell: bash
        run: |
          cp UPGRADE.md release/UPGRADE.md
          cd release
          sha256sum Paperdown-macOS.dmg Paperdown-Windows-Setup.exe > SHA256SUMS.txt
      - name: Publish versioned installers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          TAG="v$VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag and application version do not match" >&2
            exit 1
          fi
          # Re-running an already published version must not replace its binaries.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the app version for a new release."
            exit 0
          fi
          gh release create "$TAG" release/Paperdown-macOS.dmg release/Paperdown-Windows-Setup.exe release/UPGRADE.md release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Paperdown $VERSION" --notes-file packaging/release-notes.md --latest
